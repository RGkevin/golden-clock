<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reloj de la Formación - El tetragrámaton en la sucesión de Fibonacci</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <section>
      <h1>Reloj de la Formación</h1>
      <h5>Kevin López</h5>
    </section>
    <section>
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Gradientes radiales: transparente en el centro, color pleno en el extremo -->
          <radialGradient id="grid-fade" gradientUnits="userSpaceOnUse" cx="50" cy="50" r="46">
            <stop offset="0%"   stop-color="#C9A96E" stop-opacity="0" />
            <stop offset="100%" stop-color="#C9A96E" stop-opacity="1" />
          </radialGradient>
          <radialGradient id="grid-fade-five" gradientUnits="userSpaceOnUse" cx="50" cy="50" r="46">
            <stop offset="0%"   stop-color="#93c5fd" stop-opacity="0" />
            <stop offset="100%" stop-color="#93c5fd" stop-opacity="1" />
          </radialGradient>
          <radialGradient id="grid-fade-zero" gradientUnits="userSpaceOnUse" cx="50" cy="50" r="46">
            <stop offset="0%"   stop-color="#00e5ff" stop-opacity="0" />
            <stop offset="100%" stop-color="#00e5ff" stop-opacity="1" />
          </radialGradient>
        </defs>

        <!-- Retícula + anillo 1: sus dos círculos forman las 60 casillas -->
        <g id="radial-grid" aria-hidden="true"></g>
        <g id="segments" aria-label="12 segmentos de cuatro casillas"></g>
        <g id="segment-labels" aria-label="Raíces digitales de los segmentos"></g>
        <circle class="band-circle main-band" cx="50" cy="50" r="44" />
        <circle class="band-circle main-band" cx="50" cy="50" r="40" />

        <!-- Valores Fibonacci de las 60 casillas del anillo 1 -->
        <g id="ring-digits" aria-label="60 dígitos de Fibonacci módulo 10"></g>

        <!-- Anillo 2: 4 segmentos grandes (cuadrantes) -->
        <g id="ring2-arcs" aria-label="Arcos del anillo 2"></g>
        <g id="ring2-segments" aria-label="4 segmentos grandes"></g>
        <g id="ring2-labels" aria-label="Raíces digitales de los cuadrantes"></g>

        <!-- Anillo 4: segmento del índice 30 al 59 -->
        <g id="ring4-arcs" aria-label="Arcos del anillo 4"></g>
        <g id="ring4-segments" aria-label="Segmento del anillo 4"></g>
        <g id="ring4-labels" aria-label="Valor del anillo 4"></g>

        <!-- Anillo 5: índices +15 respecto al anillo 4 -->
        <g id="ring5-arcs" aria-label="Arcos del anillo 5"></g>
        <g id="ring5-segments" aria-label="Segmento del anillo 5"></g>
        <g id="ring5-labels" aria-label="Valor del anillo 5"></g>

        <!-- Anillo 6: índices +15 respecto al anillo 5 -->
        <g id="ring6-arcs" aria-label="Arcos del anillo 6"></g>
        <g id="ring6-segments" aria-label="Segmento del anillo 6"></g>
        <g id="ring6-labels" aria-label="Valor del anillo 6"></g>

        <!-- Anillo 7: índices +15 respecto al anillo 6 -->
        <g id="ring7-arcs" aria-label="Arcos del anillo 7"></g>
        <g id="ring7-segments" aria-label="Segmento del anillo 7"></g>
        <g id="ring7-labels" aria-label="Valor del anillo 7"></g>

        <!-- Textos de descomposición (visibles al seleccionar un segmento) -->
        <g id="decomp-labels" pointer-events="none"></g>
      </svg>
    </section>
    <section>
      <div class="animation-control" role="group" aria-label="Velocidad de animación">
        <button class="anim-btn" data-duration="60000">1 digit/s</button>
        <button class="anim-btn" data-duration="150000">slow mo</button>
      </div>
    </section>
    <section>
      <p class="text-center">El <a href="https://es.wikipedia.org/wiki/Tetragrámaton">tetragrámaton</a> en la <a href="https://es.wikipedia.org/wiki/Sucesión_de_Fibonacci">secuencia de fibonacci</a></p>
      <p class="text-center"><a href="https://github.com/RGkevin/golden-clock">ver más</a></p>
      <p class="text-center copyright">v0.3.0 · <a href="https://rgstudio.mx">© rgstudio</a></p>
    </section>
  </body>
  <script src="./index.js"></script>
</html>
