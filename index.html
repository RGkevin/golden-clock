<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Reloj Áureo - El tetragrámaton en la sucesión de Fibonacci</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <section>
      <h1>El Reloj Áureo</h1>
      <h5>Kevin López</h5>
      <label class="animation-control">
        <span>Animación</span>
        <input id="animation-toggle" type="checkbox" role="switch" checked />
        <span class="switch-track" aria-hidden="true"></span>
      </label>
    </section>
    <section>
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path
          id="circle-3"
          fill="none"
          stroke-width="0"
          stroke="white"
          d="
          M 20 50
          a 10,10 0 1,1 60,0
          a 20,20 0 1,1 -60,0
        "
        />
        <path
          id="circle-4"
          fill="none"
          stroke-width="0"
          stroke="skyblue"
          d="
          M 25 50
          a 10,10 0 1,1 50,0
          a 20,20 0 1,1 -50,0
        "
        />
        <path
          id="circle-5"
          fill="none"
          stroke-width="0"
          stroke="white"
          d="
          M 30 50
          a 10,10 0 1,1 40,0
          a 10,10 0 1,1 -40,0
        "
        />
        <path
          id="circle-6"
          fill="none"
          stroke-width="0"
          stroke="white"
          d="
          M 40 50
          a 10,10 0 1,1 20,0
          a 10,10 0 1,1 -20,0
        "
        />
        <g id="fibonacci-ring" data-ring-index="4" aria-label="Sucesión de Fibonacci módulo 10: 60 segmentos"></g>
        <text
          id="text-3"
          font-family="monospace"
          font-size="5"
          font-weight="normal"
          textLength="183"
        >
          <textPath textLength="183" id="text-path-3" href="#circle-3">
            &nbsp;7&nbsp;7&nbsp;5&nbsp;1&nbsp;4&nbsp;3&nbsp;6&nbsp;6&nbsp;8&nbsp;3&nbsp;9&nbsp;1
          </textPath>
        </text>
        <text
          id="text-4"
          font-family="monospace"
          font-size="5"
          font-weight="normal"
          textLength="139"
        >
          <textPath textLength="139" id="text-path-4" href="#circle-4">
            &nbsp;1&nbsp;8&nbsp;2&nbsp;4
          </textPath>
        </text>
        <text
          id="text-5"
          font-family="monospace"
          font-size="5"
          font-weight="normal"
          textLength="122"
        >
          <textPath textLength="122" id="text-path-5" href="#circle-5">
            6&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;5&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;10&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;5&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
          </textPath>
        </text>
        <text
          id="text-6"
          font-family="Helvetica, sans-serif"
          font-size="10"
          font-weight="normal"
          textLength="57"
        >
          <textPath class="chrome-only" textLength="57" id="text-path-6" href="#circle-6">
            ה&nbsp;י&nbsp;ה&nbsp;ו&nbsp;
          </textPath>
          <textPath startOffset="5" class="safari-only" textLength="59" id="text-path-6" href="#circle-6">
            &nbsp;ה&nbsp;י&nbsp;ה&nbsp;ו
          </textPath>
        </text>
      </svg>
    </section>
    <section>
      <p class="text-center">Encontré el <a href="https://es.wikipedia.org/wiki/Tetragrámaton">tetragrámaton</a> en la sucesión de Fibonacci. Consulta la explicación <a href="https://github.com/RGkevin/golden-clock">aquí</a>.</p>
      <p class="text-center">v0.2.4</p>
    </section>
  </body>
  <script src="//cdn.jsdelivr.net/npm/bowser@2.11.0/es5.min.js "></script>
  <script src="./index.js"></script>
</html>
