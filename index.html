<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Reloj Áureo - El tetragrámaton en la sucesión de Fibonacci</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <section>
      <h1>El Reloj Áureo</h1>
      <h5>Kevin López</h5>
      <label class="animation-control">
        <span>Animación</span>
        <input id="animation-toggle" type="checkbox" role="switch" />
        <span class="switch-track" aria-hidden="true"></span>
      </label>
    </section>
    <section>
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Gradientes radiales: transparente en el centro, color pleno en el extremo -->
          <radialGradient id="grid-fade" gradientUnits="userSpaceOnUse" cx="50" cy="50" r="46">
            <stop offset="0%"   stop-color="#C9A96E" stop-opacity="0" />
            <stop offset="100%" stop-color="#C9A96E" stop-opacity="1" />
          </radialGradient>
          <radialGradient id="grid-fade-five" gradientUnits="userSpaceOnUse" cx="50" cy="50" r="46">
            <stop offset="0%"   stop-color="#93c5fd" stop-opacity="0" />
            <stop offset="100%" stop-color="#93c5fd" stop-opacity="1" />
          </radialGradient>
          <radialGradient id="grid-fade-zero" gradientUnits="userSpaceOnUse" cx="50" cy="50" r="46">
            <stop offset="0%"   stop-color="#00e5ff" stop-opacity="0" />
            <stop offset="100%" stop-color="#00e5ff" stop-opacity="1" />
          </radialGradient>
          <!-- Gradiente del fondo interior del círculo 2 (R=36): gris oscuro arriba → negro abajo -->
          <linearGradient id="bg-inner-grad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
            <stop offset="0%"   stop-color="#1a1e2e" />
            <stop offset="100%" stop-color="#000005" />
          </linearGradient>
        </defs>

        <!-- Capa 0: fondo interior con gradiente (dentro de R=36) -->
        <circle cx="50" cy="50" r="36" class="bg-inner-circle" />

        <!-- Capa 1: rellenos de segmentos internos (dibujados ANTES de la retícula) -->
        <g id="arc-fills" aria-hidden="true"></g>

        <!-- Capa 2: retícula + círculos de banda (encima de los rellenos) -->
        <g id="radial-grid" aria-hidden="true"></g>
        <circle class="band-circle main-band" cx="50" cy="50" r="44" />
        <circle class="band-circle main-band" cx="50" cy="50" r="40" />
        <circle class="band-circle" cx="50" cy="50" r="36" />
        <circle class="band-circle" cx="50" cy="50" r="28" />
        <circle class="band-circle" cx="50" cy="50" r="20" />
        <circle class="band-circle" cx="50" cy="50" r="12" />
        <circle class="band-circle" cx="50" cy="50" r="4"  />

        <!-- Capa 3: etiquetas de los segmentos (encima de la retícula) -->
        <g id="arc-labels" aria-label="Valores de grupos y cuadrantes"></g>

        <!-- Capa 4: anillo exterior de dígitos (encima de todo) -->
        <g id="ring-digits" aria-label="60 dígitos de Fibonacci módulo 10"></g>
      </svg>
    </section>
    <section>
      <p class="text-center">Encontré el <a href="https://es.wikipedia.org/wiki/Tetragrámaton">tetragrámaton</a> en la sucesión de Fibonacci. Consulta la explicación <a href="https://github.com/RGkevin/golden-clock">aquí</a>.</p>
      <p class="text-center">v0.3.0</p>
    </section>
  </body>
  <script src="./index.js"></script>
</html>
