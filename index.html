<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Reloj Áureo - El tetragrámaton en la sucesión de Fibonacci</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <section>
      <h1>El Reloj Áureo</h1>
      <h5>Kevin López</h5>
      <label class="animation-control">
        <span>Animación</span>
        <input id="animation-toggle" type="checkbox" role="switch" />
        <span class="switch-track" aria-hidden="true"></span>
      </label>
    </section>
    <section>
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Gradientes radiales: transparente en el centro, color pleno en el extremo -->
          <radialGradient id="grid-fade" gradientUnits="userSpaceOnUse" cx="50" cy="50" r="46">
            <stop offset="0%"   stop-color="#C9A96E" stop-opacity="0" />
            <stop offset="100%" stop-color="#C9A96E" stop-opacity="1" />
          </radialGradient>
          <radialGradient id="grid-fade-five" gradientUnits="userSpaceOnUse" cx="50" cy="50" r="46">
            <stop offset="0%"   stop-color="#93c5fd" stop-opacity="0" />
            <stop offset="100%" stop-color="#93c5fd" stop-opacity="1" />
          </radialGradient>
          <radialGradient id="grid-fade-zero" gradientUnits="userSpaceOnUse" cx="50" cy="50" r="46">
            <stop offset="0%"   stop-color="#00e5ff" stop-opacity="0" />
            <stop offset="100%" stop-color="#00e5ff" stop-opacity="1" />
          </radialGradient>
        </defs>

        <!-- Retícula + anillo 1: sus dos círculos forman las 60 casillas -->
        <g id="radial-grid" aria-hidden="true"></g>
        <g id="segments" aria-label="12 segmentos de cuatro casillas"></g>
        <g id="segment-labels" aria-label="Raíces digitales de los segmentos"></g>
        <circle class="band-circle main-band" cx="50" cy="50" r="44" />
        <circle class="band-circle main-band" cx="50" cy="50" r="40" />

        <!-- Valores Fibonacci de las 60 casillas del anillo 1 -->
        <g id="ring-digits" aria-label="60 dígitos de Fibonacci módulo 10"></g>
      </svg>
    </section>
    <section>
      <p class="text-center">El <a href="https://es.wikipedia.org/wiki/Tetragrámaton">tetragrámaton</a> en la <a href="https://es.wikipedia.org/wiki/Sucesión_de_Fibonacci">secuencia de fibonacci</a></p>
      <p class="text-center"><a href="https://github.com/RGkevin/golden-clock">ver más</a></p>
      <p class="text-center copyright">v0.3.0 · <a href="https://rgstudio.mx">© rgstudio</a></p>
    </section>
  </body>
  <script src="./index.js"></script>
</html>
